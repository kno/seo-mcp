  FOUR NEW findings no prior pass had, each now folded into proposal.md and design.md:
  (1) None of the five returns a `criteria` echo, unlike OpportunityResult's criteria:Record<string,number>
  (src/google/opportunities.ts:79,136,190). They return only `count`, and resolve thresholds INSIDE the
  synthesis helpers (maxOpportunities 10, maxCannibalizationGroups 50, maxKeywordPages 100, maxContentGaps
  100, minPosition??21, minImpressions??10, topQueriesPerPage??10) where the client cannot see them. So
  gsc-insight-views' "applied criteria shown alongside results" needs a SECOND mechanism here: the BFF echoes
  the effective request criteria with basis:"request", and bound detection compares count to the effective
  limit rather than a returned criteria.limit. Adding a real criteria field to the five tools is a
  recommended src/seo/* follow-up, outside this change's additive-only boundary.
  (2) All five synthesize over a HARDCODED dimensions:["query","page"], rowLimit:maxGscRows (250) GSC pull
  (intelligence.ts:193-204,239-250; keyword-pages.ts:144-155,192-203). No output field records it, so the
  "at most 250 rows" caveat must be stated unconditionally by the view, never inferred from a field.
  (3) analyze_domain reports GSC failure INSIDE a 200-OK success payload: gscError is a raw upstream
  Error.message on DomainReport (domain-report.ts:34-48,95-98), never an isError result. The BFF classifier
  designed for isError text does not see it, so upstream Google text would reach the browser through a
  success envelope. Design now requires classifying the nested field, discarding the raw string, surfacing a
  classified enrichmentError code, and caching an enrichment-failed report at the `open` TTL.
  (4) Only 5 tools declare an outputSchema (health, crawl_page, crawl_site, check_links, analyze_pagespeed;
  src/server.ts:113,131,152,174,201). The other 17 in-scope tools have none. Since the registry is typed from
  the published schema map, 7 new schema modules covering 18 tools are prerequisites — this, not the UI,
  dominates the task breakdown and is why tasks.md is 11 PRs.

  SCOPE DECISION (explicit user answer, not an inference): the 6 Google Business Profile tools are OUT OF
  SCOPE for dashboard-insights entirely — no spec, no view, no BFF route, no registry row, no navigation
  entry, no task. A FUTURE SDD change owns that domain. Related safety finding: business_reply_review,
  business_update_info and business_create_post are LIVE PUBLIC WRITES gated only by a confirm:true input
  (src/server.ts:899-982), which falsifies the "MCP is read-only analysis" premise at the SERVER level. The
  read-only property is now a BFF property, so the authenticated registry MUST be an explicit allowlist with
  a RED test asserting no business_* name is present — a write tool must be unreachable by omission.

